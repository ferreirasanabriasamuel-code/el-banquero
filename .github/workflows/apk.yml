name: APK · versión de prueba

on:
  push:
    branches: [main]
    paths:
      - "version-prueba/**"
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

# varios pushes seguidos = una sola corrida final (la nueva cancela a la
# vieja): ni desperdicia minutos ni compiten dos corridas por el Release
concurrency:
  group: apk-prueba
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decodificar keystore de prueba
        run: base64 -d android/keystore/prueba.keystore.b64 > android/keystore/prueba.keystore

      - name: Empaquetar la web dentro del APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r version-prueba/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/sw.js

      # Los PNG del lanzador (mipmap-*/ic_launcher*.png) están comitados:
      # se generaron con scripts/make_launcher_icons.py, así el CI no
      # depende de ImageMagick ni de Pillow.

      - name: Compilar APK firmado
        run: gradle -p android assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk El-Banquero-prueba.apk
          sha256sum El-Banquero-prueba.apk
          du -h El-Banquero-prueba.apk

      - name: Subir artefacto de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: el-banquero-prueba-apk
          path: El-Banquero-prueba.apk

      - name: Publicar en Releases (la última versión siempre queda acá)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES_EOF'
          APK de la **versión de prueba** de El Banquero (10 rondas por partida).

          Cómo instalar:
          1. Descargá El-Banquero-prueba.apk (más abajo).
          2. Abrilo en tu Android; si el sistema lo pide, permití instalar apps de fuentes desconocidas.
          3. Queda como app con su propio ícono: funciona sin conexión y también con el modo online por código de sala.

          Actualizaciones: este archivo se reconstruye automáticamente con cada cambio del juego; como está firmado con clave fija, se puede instalar encima de la versión anterior sin desinstalar.
          NOTES_EOF
          if gh release view prueba-apk -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload prueba-apk El-Banquero-prueba.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create prueba-apk El-Banquero-prueba.apk -R "$GITHUB_REPOSITORY"               --title "El Banquero · Versión de prueba (APK)"               --notes-file /tmp/release-notes.md
          fi

      # El ZIP de "doble clic" (el-banquero-version-prueba.zip) se regenera
      # del estado vigente de version-prueba/ y se comitea solo si cambió:
      # timestamps normalizados para que contenidos iguales den zip idéntico.
      # El commit no re-dispara este workflow (paths no incluye el zip).
      - name: Regenerar el ZIP de doble clic (si cambió)
        run: |
          rm -rf /tmp/zipstage && mkdir -p /tmp/zipstage/el-banquero-prueba
          cp -r version-prueba/. /tmp/zipstage/el-banquero-prueba/
          find /tmp/zipstage -exec touch -d "2026-01-01 00:00:00" {} +
          (cd /tmp/zipstage && find el-banquero-prueba -print0 | sort -z | xargs -0 zip -qX /tmp/nuevo.zip)
          if [ -f el-banquero-version-prueba.zip ] && cmp -s /tmp/nuevo.zip el-banquero-version-prueba.zip; then
            echo "ZIP sin cambios: no se comitea"
          else
            cp /tmp/nuevo.zip el-banquero-version-prueba.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add el-banquero-version-prueba.zip
            git commit -m "ZIP de la versión de prueba regenerado desde version-prueba/ (automático)"
            git push
          fi
