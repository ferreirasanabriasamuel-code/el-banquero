name: APK · versión definitiva

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "img/**"
      - "fonts/**"
      - "sfx/**"
      - "android-definitiva/**"
      - ".github/workflows/apk-definitiva.yml"
  workflow_dispatch:

# una corrida a la vez por versión (la nueva cancela a la vieja):
# ni desperdicia minutos ni compiten dos corridas por el Release
concurrency:
  group: apk-definitiva
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Los íconos lanzador y el keystore viven una sola vez, en el proyecto
      # de prueba (android/): se copian acá antes de compilar. Así un ícono
      # nuevo se actualiza en ambas apps sin duplicar binarios en el repo.
      - name: Copiar íconos y keystore del proyecto compartido
        run: |
          mkdir -p android-definitiva/app/src/main/res android-definitiva/keystore
          cp -r android/app/src/main/res/mipmap-* android-definitiva/app/src/main/res/
          cp android/keystore/prueba.keystore.b64 android-definitiva/keystore/

      - name: Decodificar keystore de firma
        run: base64 -d android-definitiva/keystore/prueba.keystore.b64 > android-definitiva/keystore/prueba.keystore

      # El juego completo es la raíz del repo: index.html + css/ js/ img/
      # fonts/ sfx/. No se copian README, zips, version-prueba/ ni android/.
      - name: Empaquetar el juego completo dentro del APK
        run: |
          mkdir -p android-definitiva/app/src/main/assets/www
          cp -r css fonts img js sfx index.html android-definitiva/app/src/main/assets/www/
          rm -f android-definitiva/app/src/main/assets/www/sw.js

      - name: Compilar APK firmado
        run: gradle -p android-definitiva assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          cp android-definitiva/app/build/outputs/apk/release/app-release.apk El-Banquero.apk
          sha256sum El-Banquero.apk
          du -h El-Banquero.apk

      - name: Subir artefacto de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: el-banquero-apk
          path: El-Banquero.apk

      - name: Publicar en Releases (la última versión siempre queda acá)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes-def.md <<'NOTES_EOF'
          APK de la **versión definitiva** de El Banquero: el juego completo, sin límite de rondas impuesto — al empezar la partida elegís 30 rondas, 50 rondas o ∞ (ilimitadas).

          Cómo instalar:
          1. Descargá El-Banquero.apk (más abajo).
          2. Abrilo en tu Android; si el sistema lo pide, permití instalar apps de fuentes desconocidas.
          3. Queda como app con su propio ícono: funciona sin conexión y también con el modo online por código de sala.

          Convive con la versión de prueba ("El Banquero · prueba", 10 rondas fijas): son apps separadas, podés tener las dos en el mismo celular.

          Actualizaciones: este archivo se reconstruye automáticamente con cada cambio del juego; como está firmado con clave fija, se puede instalar encima de la versión anterior sin desinstalar.
          NOTES_EOF
          if gh release view definitiva-apk -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload definitiva-apk El-Banquero.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create definitiva-apk El-Banquero.apk -R "$GITHUB_REPOSITORY" \
              --title "El Banquero · Versión definitiva (APK)" \
              --notes-file /tmp/release-notes-def.md
          fi
